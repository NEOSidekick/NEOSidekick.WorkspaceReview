# The nested "schemas" form is mandatory: t3n only honours an endpoint level
# "errorTransform" when a schemas entry is present, and only there are
# "typeDefs" and "resolverPathPattern" read (see SchemaService).
t3n:
  GraphQL:
    endpoints:
      'workspace-review':
        logRequests: false
        context: 'NEOSidekick\WorkspaceReview\GraphQL\Context\ReviewContext'
        errorTransform: 'NEOSidekick\WorkspaceReview\GraphQL\Transform\ErrorTransform'
        schemas:
          root:
            typeDefs: 'resource://NEOSidekick.WorkspaceReview/Private/GraphQL/schema.root.graphql'
            resolverPathPattern: 'NEOSidekick\WorkspaceReview\GraphQL\Resolver\Type\{Type}Resolver'
