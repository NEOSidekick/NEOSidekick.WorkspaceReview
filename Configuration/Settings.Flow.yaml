Neos:
  Flow:
    mvc:
      routes:
        # The preview route claims "neos/workspace-review/preview", which the
        # backend module route "neos/{module}" would otherwise swallow.
        'NEOSidekick.WorkspaceReview':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              # The backend session has to authenticate the GraphQL endpoint
              # and the preview rendering as well; both live outside the Neos
              # controller namespaces the provider covers by default.
              'NEOSidekick.WorkspaceReview:GraphQLControllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 't3n\GraphQL\Controller\.*'
              'NEOSidekick.WorkspaceReview:Controllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'NEOSidekick\WorkspaceReview\Controller\.*'
